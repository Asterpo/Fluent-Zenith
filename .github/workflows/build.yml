name: Reusable build

on:
  workflow_call:
    inputs:
      artifact-name:
        required: false
        type: string
        default: fluent-zenith-build
      source-ref:
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-ref }}
          submodules: true

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/rokit
            Packages
          key: ${{ runner.os }}-rokit-wally-${{ hashFiles('rokit.toml', 'wally.toml', 'wally.lock') }}

      - name: Setup RoKit
        uses: CompeyDev/setup-rokit@v0.1.2

      - name: Install locked toolchain and dependencies
        run: |
          rokit trust rojo-rbx/rojo
          rokit trust lune-org/lune
          rokit trust seaofvoices/darklua
          rokit trust UpliftGames/wally
          rokit trust JohnnyMorganz/wally-package-types
          rokit trust JohnnyMorganz/StyLua
          rokit trust Kampfkarren/selene
          rokit install
          wally install --project-path .

      - name: Check formatting
        run: stylua --check --line-endings Windows PublicTypes.luau Test.luau Src/Modules/Adapters.luau Src/Modules/Scope.luau Src/Modules/Runtime.luau Src/Modules/InputValue.luau Addons/Runtime.luau

      - name: Lint Luau
        run: selene --allow-warnings Src Addons PublicTypes.luau

      - name: Check strict public sources
        shell: pwsh
        run: |
          $sources = @('PublicTypes.luau', 'Src/Modules/Adapters.luau', 'Src/Modules/Scope.luau', 'Src/Modules/Runtime.luau', 'Src/Modules/InputValue.luau', 'Addons/Runtime.luau')
          $missing = $sources | Where-Object { -not ((Get-Content $_ -TotalCount 1) -match '^--!strict') }
          if ($missing) { throw "Strict Luau analysis requires --!strict: $($missing.FullName -join ', ')" }

      - name: Lune, mock UNC, and release smoke tests
        run: lune run Test.luau

      - name: Build once
        run: lune run Lune/Build bundle header=Lune/Build/Header.luau minify=true ci-mode=true

      - name: Verify assets, size budgets, and manifest
        shell: pwsh
        run: |
          $assets = @("Distribution/Fluent.luau", "Distribution/Fluent.rbxm")
          $maxBytes = @{ "Fluent.luau" = 2097152; "Fluent.rbxm" = 4194304 }
          foreach ($asset in $assets) {
            if (-not (Test-Path $asset) -or (Get-Item $asset).Length -eq 0) { throw "Expected non-empty release asset: $asset" }
            if ((Get-Item $asset).Length -gt $maxBytes[(Split-Path $asset -Leaf)]) { throw "Size budget exceeded: $asset" }
          }
          $hashes = Get-FileHash $assets -Algorithm SHA256
          $hashes | ForEach-Object { "{0} *{1}" -f $_.Hash.ToLowerInvariant(), (Split-Path $_.Path -Leaf) } | Set-Content Distribution/SHA256SUMS.txt
          $version = [regex]::Match((Get-Content wally.toml -Raw), 'version\s*=\s*"([^"]+)"').Groups[1].Value
          $files = @{}
          foreach ($hash in $hashes) { $files[(Split-Path $hash.Path -Leaf)] = @{ size = (Get-Item $hash.Path).Length; sha256 = $hash.Hash.ToLowerInvariant() } }
          @{ version = $version; tag = $env:GITHUB_REF_NAME; commit = $env:GITHUB_SHA; tools = @{ rokit = (rokit --version); wally = (wally --version); stylua = (stylua --version); selene = (selene --version) }; files = $files } | ConvertTo-Json -Depth 4 | Set-Content Distribution/release-manifest.json

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          if-no-files-found: error
          retention-days: 90
          path: |
            Distribution/Fluent.luau
            Distribution/Fluent.rbxm
            Distribution/SHA256SUMS.txt
            Distribution/release-manifest.json

      - name: Attest release artifact
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            Distribution/Fluent.luau
            Distribution/Fluent.rbxm

name: Roll back latest release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing known-good vMAJOR.MINOR.PATCH tag to restore as latest
        required: true
        type: string
      reason:
        description: Incident or operational reason for the rollback
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Promote known-good release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.release_tag }}
          REASON: ${{ inputs.reason }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid stable tag"; exit 1; }
          gh release view "$TAG" >/dev/null
          gh release edit "$TAG" --latest
          { echo "## Rollback completed"; echo "Promoted $TAG as latest."; echo "Reason: $REASON"; } >> "$GITHUB_STEP_SUMMARY"

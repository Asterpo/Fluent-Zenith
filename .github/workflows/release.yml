name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish (for example v1.0.2)"
        required: true
        type: string
      summary:
        description: "Optional release summary; leave blank to generate notes"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.validate.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - id: validate
        shell: bash
        run: |
          tag="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid release tag: $tag"; exit 1; }
          [[ "$(git describe --tags --exact-match HEAD)" = "$tag" ]] || { echo "Checkout is not tag $tag"; exit 1; }
          version="${tag#v}"
          package="$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)"/\1/p' wally.toml)"
          runtime="$(sed -nE 's/.*Version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' Src/init.luau)"
          [[ "$package" = "$version" && "$runtime" = "$version" ]] || { echo "Version mirrors do not match $tag"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
  build:
    needs: validate-release
    uses: ./.github/workflows/build.yml
    with:
      artifact-name: release-assets
      source-ref: ${{ needs.validate-release.outputs.tag }}

  publish:
    name: Publish verified release
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    steps:
      - name: Resolve release metadata
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_SUMMARY: ${{ inputs.summary }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="$REF_NAME"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then TAG="$INPUT_TAG"; fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          printf '%s' "$INPUT_SUMMARY" > release-summary.md

      - name: Download verified release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets

      - name: Verify downloaded immutable artifact
        working-directory: release-assets
        run: |
          sha256sum --check SHA256SUMS.txt
          test -s release-manifest.json
          test -s Fluent.luau
          test -s Fluent.rbxm

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          elif [ -s release-summary.md ]; then
            gh release create "$TAG" --title "$TAG" --draft --notes-file release-summary.md release-assets/*
          else
            gh release create "$TAG" --title "$TAG" --draft --generate-notes release-assets/*
          fi

      - name: Publish release only after asset upload succeeds
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
        run: gh release edit "$TAG" --draft=false --latest
